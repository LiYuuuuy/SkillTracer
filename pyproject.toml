[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skilltracer"
version = "0.1.0"
description = "Browser task planning, execution, repair and skill learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["browsergym-core==0.10.2+skilltracer.2", "openai>=1,<3", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["ruff>=0.14", "build>=1.2,<2"]

[project.scripts]
skilltracer = "skilltracer.cli:main"

[project.urls]
Homepage = "https://liyuuuuy.github.io/SkillTracer/"
Repository = "https://github.com/LiYuuuuy/SkillTracer"
Issues = "https://github.com/LiYuuuuy/SkillTracer/issues"
Paper = "https://doi.org/10.1145/3770855.3817981"

[tool.hatch.build.targets.wheel]
packages = ["skilltracer"]

[tool.hatch.build.targets.sdist]
include = [
    "/skilltracer", "/browsergym/core", "/scripts", "/tests", "/docs",
    "/README.md", "/CHANGELOG.md", "/THIRD_PARTY_NOTICES.md",
    "/index.html", "/overview.png", "/case_study.png", "/result.png",
    "/requirements.txt", "/requirements.lock.txt",
    "/pyproject.toml", "/.env.example", "/.gitignore",
]
exclude = ["**/__pycache__/**", "**/*:Zone.Identifier"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
